name: YT-Live-24x7

# ─────────────────────────────────────────────────────────────────────────────
#  24/7 YouTube Live restream on GitHub Actions (self-chaining, no 6h gap)
#  • Job khud ko re-dispatch karta hai har ~5h30m par (6h hard limit se pehle)
#  • Watchdog cron har 20 min: agar stream band mila to foran start
#  • 300s / 5-min cron interval ka koi intezar nahi — chain se lagataar chalta hai
#  • Source down ho to placeholder screen on air rehti hai (stream nahi rukti)
#  • Repo secret chahiye: YT_STREAM_KEY
#    (optional: GH_PAT — agar GITHUB_TOKEN se re-dispatch block ho)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/20 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: yt-live-24x7
  cancel-in-progress: false

env:
  SOURCE_URL: ${{ vars.SOURCE_URL || 'https://muaaznamtosonahoga1.hf.space/live/default/index.m3u8' }}
  RTMP_BASE: rtmp://a.rtmp.youtube.com/live2
  MAX_SECONDS: "19800"          # 5h30m  (6h limit se 30 min pehle exit)
  FFMPEG_RUN: "7200"            # har 2h ffmpeg fresh restart (safety, 1-2s blip)
  UA: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

jobs:
  stream:
    name: YouTube 24/7 restream
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # ── 1) ffmpeg + fonts ──────────────────────────────────────────────────
      - name: Install ffmpeg
        run: |
          set -uo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          fi
          ffmpeg -version | head -1

      # ── 2) placeholder banane wala + stream loop ───────────────────────────
      - name: Stream to YouTube (auto-heal loop)
        env:
          YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
        run: |
          set -uo pipefail
          SRC="$SOURCE_URL"
          DEST="$RTMP_BASE/$YT_STREAM_KEY"
          if [ -z "${YT_STREAM_KEY:-}" ]; then
            echo "::error::Repo secret YT_STREAM_KEY set nahi hai (Settings → Secrets → Actions)"
            exit 1
          fi
          mkdir -p work

          # ---- source format detect (placeholder usi size me banega) --------
          PROBE=$(ffprobe -v error -select_streams v:0 \
                    -show_entries stream=width,height,r_frame_rate \
                    -of default=nw=1:nk=1 "$SRC" 2>/dev/null | head -3 | tr '\n' ' ')
          read -r W H RATE <<< "${PROBE:-1280 720 25/1}"
          W=${W:-1280}; H=${H:-720}; FPS=${RATE%%/*}; FPS=${FPS:-25}
          [ "$FPS" -gt 60 ] 2>/dev/null && FPS=25
          W=$(( W/2*2 )); H=$(( H/2*2 ))
          echo "source format: ${W}x${H} @ ${FPS}fps"

          # ---- 20s placeholder (loop hoti hai jab source down ho) -----------
          FONT=$(fc-match -f '%{file}' "DejaVu Sans:bold" 2>/dev/null || true)
          DT=""
          if [ -n "${FONT:-}" ] && [ -f "$FONT" ]; then
            printf 'RECONNECTING'                              > work/t1.txt
            printf 'Stream will resume shortly'                 > work/t2.txt
            printf 'Auto-reconnect is active. Please stay tuned.' > work/t3.txt
            printf '24/7 LIVE BROADCAST'                        > work/t4.txt
            DT=",drawtext=fontfile=$FONT:textfile=work/t1.txt:fontcolor=0xef4444:fontsize=$((H/22)):x=(w-tw)/2:y=(h/2)-$((H*28/100)):alpha='0.35+0.65*abs(sin(t*2))'"
            DT="$DT,drawtext=fontfile=$FONT:textfile=work/t2.txt:fontcolor=white:fontsize=$((H/14)):x=(w-tw)/2:y=(h/2)-$((H*7/100))"
            DT="$DT,drawtext=fontfile=$FONT:textfile=work/t3.txt:fontcolor=0x94a3b8:fontsize=$((H/28)):x=(w-tw)/2:y=(h/2)+$((H*7/100))"
            DT="$DT,drawtext=fontfile=$FONT:textfile=work/t4.txt:fontcolor=0x64748b:fontsize=$((H/38)):x=(w-tw)/2:y=h-$((H*10/100)):alpha='0.55+0.45*abs(sin(t))'"
          fi
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=0x0a1020:s=${W}x${H}:r=${FPS}" \
            -f lavfi -i "anullsrc=channel_layout=stereo:sample_rate=44100" \
            -t 20 -vf "drawbox=x=0:y=0:w=iw:h=ih:color=0x0a1020@1:t=fill${DT},format=yuv420p" \
            -c:v libx264 -profile:v baseline -preset veryfast -b:v 800k -maxrate 1200k -bufsize 2400k \
            -g $((FPS*2)) -keyint_min $((FPS*2)) -sc_threshold 0 -pix_fmt yuv420p \
            -c:a aac -b:a 96k -ar 44100 -ac 2 -movflags +faststart work/fallback.mp4 \
          && echo "placeholder ready $(du -h work/fallback.mp4 | cut -f1)" \
          || echo "::warning::placeholder build failed — sirf live mode chalega"

          # ---- source health check -----------------------------------------
          healthy() {
            local body last seg code
            body=$(curl -fsS -m 8 -A "$UA" "$SRC" 2>/dev/null) || return 1
            printf '%s' "$body" | grep -q '#EXTM3U' || return 1
            printf '%s' "$body" | grep -q '#EXTINF' || return 1
            last=$(printf '%s\n' "$body" | grep -v '^#' | grep -v '^[[:space:]]*$' | tail -1)
            [ -n "$last" ] || return 1
            case "$last" in
              http*) seg="$last" ;;
              *)     seg="${SRC%/*}/$last" ;;
            esac
            code=$(curl -s -o /dev/null -m 8 -r 0-4096 -w '%{http_code}' -A "$UA" "$seg" 2>/dev/null)
            [ "$code" = "200" ] || [ "$code" = "206" ]
          }

          # ---- main loop (5h30m budget, phir next run chain) ---------------
          START=$(date +%s); FAILS=0; CYCLES=0; MODE=starting
          while : ; do
            NOW=$(date +%s); ELAPSED=$(( NOW - START ))
            [ "$ELAPSED" -ge "$MAX_SECONDS" ] && break
            REMAIN=$(( MAX_SECONDS - ELAPSED ))
            RUN=$(( REMAIN < FFMPEG_RUN ? REMAIN : FFMPEG_RUN ))
            CYCLES=$(( CYCLES + 1 ))

            if healthy; then
              MODE=live
              echo "──[$CYCLES] LIVE  (elapsed ${ELAPSED}s, window ${RUN}s) ──"
              timeout --signal=INT $(( RUN + 10 )) ffmpeg -hide_banner -loglevel warning -nostdin \
                -fflags +genpts -live_start_index -3 \
                -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 -rw_timeout 15000000 \
                -user_agent "$UA" -i "$SRC" \
                -t "$RUN" -map 0:v:0 -map 0:a:0? \
                -c:v copy -c:a aac -b:a 128k -ar 44100 -ac 2 \
                -max_muxing_queue_size 2048 -flvflags no_duration_filesize \
                -y -f flv "$DEST" 2>&1 | grep -viE "non-monotonic|backward in time|past duration|queue input" || true
              RC=${PIPESTATUS[0]:-$?}
            elif [ -f work/fallback.mp4 ]; then
              MODE=fallback
              echo "──[$CYCLES] PLACEHOLDER (source down) ──"
              timeout --signal=INT $(( RUN + 10 )) ffmpeg -hide_banner -loglevel warning -nostdin \
                -re -stream_loop -1 -fflags +genpts -i work/fallback.mp4 \
                -t "$RUN" -c:v copy -c:a aac -b:a 128k -ar 44100 -ac 2 \
                -max_muxing_queue_size 2048 -flvflags no_duration_filesize \
                -y -f flv "$DEST" 2>&1 | grep -viE "non-monotonic|backward in time" || true
              RC=${PIPESTATUS[0]:-$?}
            else
              MODE=nosource; RC=1
              echo "──[$CYCLES] source down, placeholder bhi nahi — 15s wait ──"
              sleep 15
            fi

            # fast-fail (galat key / RTMP block) par backoff
            NOW=$(date +%s)
            if [ "$MODE" = "live" ] && [ "$(( NOW - START ))" -ge "$MAX_SECONDS" ]; then break; fi
            if [ "$MODE" = "live" ] && [ "${RC:-1}" -ne 0 ]; then
              FAILS=$(( FAILS + 1 ))
              SLEEP=$(( FAILS * 3 )); [ "$SLEEP" -gt 30 ] && SLEEP=30
              echo "   ffmpeg exit rc=$RC — ${SLEEP}s baad retry"
              sleep "$SLEEP"
            else
              FAILS=0
              sleep 2
            fi
          done

          echo "job window khatam — next run chain ho raha hai"

      # ── 3) next run khud trigger karo (koi cron gap nahi) ────────────────
      - name: Chain next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          WF_PATH="${GITHUB_WORKFLOW_REF%@*}"; WF_FILE="${WF_PATH##*/}"
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WF_FILE}/dispatches" \
              -d "{\"ref\":\"${GITHUB_REF_NAME}\"}")
            echo "dispatch attempt $i -> HTTP $CODE"
            [ "$CODE" = "204" ] && exit 0
            cat /tmp/resp.json || true
            sleep $(( i * 4 ))
          done
          echo "::warning::re-dispatch fail — watchdog cron 20 min me khud uthayega"

      # ── 4) keepalive: 60-din inactivity par cron band na ho ──────────────
      - name: Keepalive commit
        if: always()
        run: |
          set -uo pipefail
          DAY=$(date -u +%F)
          if ! grep -qx "$DAY" .keepalive 2>/dev/null; then
            echo "$DAY" >> .keepalive
            git config user.name  "ytlive-bot"
            git config user.email "ytlive-bot@users.noreply.github.com"
            git add .keepalive
            git commit -m "keepalive $DAY" || true
            git push || echo "::warning::keepalive push fail (permissions?)"
          fi
