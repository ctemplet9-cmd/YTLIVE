# =============================================================================
#  YT-Live-24x7-PRO  ·  YouTube Live 24/7 restream (GitHub Actions, self-chaining)
# -----------------------------------------------------------------------------
#  Is YML ke andar hi poora engine hai — koi dusri file, koi server, koi PRO
#  subscription nahi. Sirf repo secret chahiye: YT_STREAM_KEY
#
#  SEAMLESS DESIGN (stream kabhi nahi rukti):
#    source m3u8 ──► local HLS relay (127.0.0.1:8080) ──► ek continuous ffmpeg
#                    ▲ live segments                        (decode→normalize→x264)
#                    └ source dead → placeholder segments          ▼
#                       ("Stream will resume shortly")      YouTube RTMP
#
#    • relay kabhi "dead" nahi hota: source girta hai to wahi playlist me
#      placeholder segments (discontinuity ke sath) daal deta hai
#    • is liye ffmpeg ko reconnect/restart karne ki zarurat nahi — 5h30m tak
#      EK hi process, YouTube ko lagta hai stream lagataar chal rahi hai
#    • ffmpeg timestamp normalize karta hai (setpts/asetpts + CFR) is liye
#      source badalne par bhi 0 gap, 0 jitter, 0 "backward in time" error
#    • 6h limit se pehle next run khud dispatch hota hai aur "slot" ka intezar
#      karta hai → handoff gap sirf ~2-5 second, har 5.5 ghante me ek dafa
#    • watchdog cron */20 = agar chain toot jaye to 20 min me khud uth jata hai
#    • har din keepalive commit = GitHub 60-din inactivity par cron band na kare
# =============================================================================

name: YT-Live-24x7-PRO

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/20 * * * *"        # watchdog (chain toote to backup)

permissions:
  actions: write                  # next run dispatch karne ke liye
  contents: write                 # keepalive commit ke liye

concurrency:
  group: yt-live-24x7-pro         # ek waqt me sirf ek stream (duplicate nahi)
  cancel-in-progress: false

env:
  SOURCE_URL: ${{ vars.SOURCE_URL || 'https://muaaznamtosonahoga1.hf.space/live/default/index.m3u8' }}
  RTMP_BASE: rtmp://a.rtmp.youtube.com/live2
  WINDOW: "19800"                 # 5h30m streaming window (6h limit se pehle)
  HANDOFF: "75"                   # window end se 75s pehle next run dispatch
  BITRATE: "2500k"                # 720p ke liye perfect; 1080p source ho to 4500k
  MAXRATE: "3000k"
  RELAY_PORT: "8080"
  RELAY_STALE: "12"                # source itni der naya segment na de -> placeholder
  RELAY_DWELL: "8"                 # placeholder kam se kam itni der (flicker/flap nahi)
  RELAY_KEEP: "15"                 # playlist window (30s) — ffmpeg kabhi peeche nahi rehta
  RELAY_TRASH_TTL: "120"           # segments 2 min disk par (404 kabhi nahi)
  UA: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

jobs:
  live:
    name: 24/7 YouTube Live
    runs-on: ubuntu-latest
    timeout-minutes: 355            # 5h55m hard stop (6h runner limit se pehle)

    steps:
      # ───────────────────────────────────────────────────────────────────────
      # 1) SLOT: agar pichla window abhi chal raha hai to uske khatam hone ka
      #    intezar — is se do stream ek sath connect ho kar ek dusre ko kick
      #    nahi karti (handoff gap minimum)
      # ───────────────────────────────────────────────────────────────────────
      - name: Wait for previous window (slot)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          WF_FILE="${GITHUB_WORKFLOW_REF%@*}"; WF_FILE="${WF_FILE##*/}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WF_FILE}/runs?status=in_progress&per_page=50"
          for i in $(seq 1 120); do
            OTHERS=$(curl -sS -m 10 -H "Authorization: Bearer $GH_TOKEN" "$API" \
              | jq --arg id "$GITHUB_RUN_ID" '[.workflow_runs[]? | select((.id|tostring) != $id)] | length' 2>/dev/null || echo 0)
            if [ "${OTHERS:-0}" -eq 0 ]; then
              echo "slot free — streaming shuru"
              exit 0
            fi
            echo "[$i] pichla window chal raha hai (${OTHERS}) — 3s wait..."
            sleep 3
          done
          echo "::warning::6 minute tak slot na mila — phir bhi shuru kar rahe hain"

      - name: Version check (run summary me dikhega)
        run: |
          {
            echo "### YT Live 24x7 — ENGINE v3.0"
            echo ""
            echo "| cheez | value |"
            echo "|---|---|"
            echo "| relay version | **3.0** (no-404 · no-shrink · fresh retry) |"
            echo "| source | \`$SOURCE_URL\` |"
            echo "| window | ${WINDOW}s (5h30m) |"
            echo "| bitrate | ${BITRATE} / max ${MAXRATE} |"
            echo "| watchdog cron | every 20 min |"
            echo ""
            echo "stream band nahi hoti: source down -> placeholder screen rotate hoti hai"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # ───────────────────────────────────────────────────────────────────────
      # 2) Tools (cache se fast; cache miss par apt)
      # ───────────────────────────────────────────────────────────────────────
      - name: Install ffmpeg + fonts + jq
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core jq
          ffmpeg -version | head -1
          jq --version

      # ───────────────────────────────────────────────────────────────────────
      # 3) Source format detect (placeholder bilkul usi size/fps me banega,
      #    warna YouTube ko mid-stream resolution change dikhta hai)
      # ───────────────────────────────────────────────────────────────────────
      - name: Detect source format
        run: |
          set -uo pipefail
          OUT=$(timeout 25 ffprobe -v error -select_streams v:0 \
                  -show_entries stream=width,height,r_frame_rate \
                  -of default=nw=1:nk=1 "$SOURCE_URL" 2>/dev/null | head -3 | tr '\n' ' ')
          read -r W H RATE <<< "${OUT:-1280 720 25/1}"
          W=${W:-1280}; H=${H:-720}
          FPS=${RATE%%/*}; FPS=${FPS:-25}
          # sirf standard live fps rakhein (YouTube ko chahiye)
          case "$FPS" in 24|25|30|50|60) ;; *) FPS=25 ;; esac
          W=$(( W/2*2 )); H=$(( H/2*2 ))
          echo "SRC_W=$W"   >> "$GITHUB_ENV"
          echo "SRC_H=$H"   >> "$GITHUB_ENV"
          echo "SRC_FPS=$FPS" >> "$GITHUB_ENV"
          echo "source: ${W}x${H} @ ${FPS}fps"

      # ───────────────────────────────────────────────────────────────────────
      # 4) Relay (poora engine yahin embed hai — koi alag file nahi)
      # ───────────────────────────────────────────────────────────────────────
      - name: Write relay engine
        run: |
          cat > /tmp/relay.py <<'PYEOF'
          #!/usr/bin/env python3
          """
          relay.py v2 — bulletproof HLS failover relay (YouTube 24/7 ke liye).

          Guarantees (yahi "stream kabhi na ruke" ka asal mechanism hai):
            1. playlist kabhi khaali / chhoti / peeche nahi hoti  -> ffmpeg ko kabhi
               "segment missing" ya "playlist behind" nahi milta
            2. koi segment request 404 nahi hoti — missing ho to last-good bytes 200
               milte hain (ffmpeg atakta nahi, YouTube ko data behta rehta hai)
            3. source dead -> placeholder pool se turant segments (CPU ~0)
            4. transition par purani entries flush NAHI hoti (window shrink = ffmpeg stall)
            5. files 120s tak disk par rehti hain (in-flight reads safe)

          Endpoints: /index.m3u8, /<seg>, /status.json, /healthz
          """
          import json
          import os
          import re
          import subprocess
          import threading
          import time
          import urllib.request
          from collections import deque
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          UPSTREAM = os.environ.get("UPSTREAM", "").strip()
          PORT = int(os.environ.get("RELAY_PORT", "8080"))
          WORK = os.environ.get("RELAY_DIR", "/tmp/relay")
          SEG_DUR = float(os.environ.get("RELAY_SEG_DUR", "2"))
          KEEP = int(os.environ.get("RELAY_KEEP", "15"))          # 30s window ffmpeg ke liye
          TRASH_TTL = float(os.environ.get("RELAY_TRASH_TTL", "120"))
          POLL = float(os.environ.get("RELAY_POLL", "1"))
          STALE = float(os.environ.get("RELAY_STALE", "8"))
          DWELL = float(os.environ.get("RELAY_DWELL", "5"))
          UA = os.environ.get("UA", "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                                     "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")
          FALLBACK_TEXT = os.environ.get("FALLBACK_TEXT", "Stream will resume shortly")
          FALLBACK_SUB = os.environ.get("FALLBACK_SUBTEXT", "Auto-reconnect is active. Please stay tuned.")
          FALLBACK_BADGE = os.environ.get("FALLBACK_BADGE", "RECONNECTING")
          FALLBACK_FOOTER = os.environ.get("FALLBACK_FOOTER", "24/7 LIVE BROADCAST")
          W = int(os.environ.get("W", "1280"))
          H = int(os.environ.get("H", "720"))
          FPS = int(os.environ.get("FPS", "25"))
          FONT = os.environ.get("FONT", "")
          POOL_N = 3

          LOG = deque(maxlen=200)
          LOCK = threading.Lock()
          ENTRIES = deque()              # {"name","dur","disc","seq"}
          TRASH = []                     # [(path, ts)]
          POOL = []                      # cached placeholder segment names
          LAST_GOOD = {"name": None}
          VER = "3.0"
          STATE = {"ver": VER, "mode": "init", "reason": "starting", "switched": 0, "up_ok": 0,
                   "up_fail": 0, "seg_index": 0, "started": time.time(), "served_404": 0}


          def log(msg):
              line = f"[relay {time.strftime('%H:%M:%S')}] {msg}"
              print(line, flush=True)
              LOG.append(line)


          os.makedirs(WORK, exist_ok=True)


          def fetch(url, timeout=8):
              """har dafa FRESH request (cache-busting + no-cache) — stale proxy/CDN se bachne ke liye."""
              sep = "&" if "?" in url else "?"
              fresh = f"{url}{sep}_yt={int(time.time() * 1000)}"
              req = urllib.request.Request(fresh, headers={
                  "User-Agent": UA,
                  "Cache-Control": "no-cache, no-store, max-age=0",
                  "Pragma": "no-cache",
                  "Accept": "*/*",
              })
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, r.read()


          def parse_playlist(body):
              if isinstance(body, bytes):
                  body = body.decode("utf-8", "ignore")
              seq = 0
              m = re.search(r"#EXT-X-MEDIA-SEQUENCE:\s*(\d+)", body)
              if m:
                  seq = int(m.group(1))
              items, dur = [], None
              for line in body.splitlines():
                  line = line.strip()
                  if line.startswith("#EXTINF:"):
                      try:
                          dur = float(line.split(":", 1)[1].split(",")[0])
                      except Exception:
                          dur = SEG_DUR
                  elif line and not line.startswith("#"):
                      items.append((line, dur or SEG_DUR))
                      dur = None
              return seq, items


          def abs_url(base, uri):
              return uri if uri.startswith("http") else base.rsplit("/", 1)[0] + "/" + uri


          # ---------------------------------------------------------------- placeholder
          def build_pool():
              """Boot par 3 placeholder segments (rotate) — outage me CPU ~0 lagta hai."""
              global POOL
              if FONT and os.path.exists(FONT):
                  files = {}
                  for k, v in (("t_badge", FALLBACK_BADGE), ("t_main", FALLBACK_TEXT),
                               ("t_sub", FALLBACK_SUB), ("t_foot", FALLBACK_FOOTER)):
                      p = os.path.join(WORK, k + ".txt")
                      open(p, "w").write(v)
                      files[k] = p
                  base = ("drawbox=x=0:y=0:w=iw:h=ih:color=0x0a1020@1:t=fill"
                          f",drawbox=x=0:y=0:w=iw:h={max(4, H // 80)}:color=0xef4444@1:t=fill")
                  f = f"fontfile={FONT}:"
                  base += (f",drawtext={f}textfile={files['t_badge']}:fontcolor=0xef4444:fontsize={max(16, H//22)}"
                           f":x=(w-tw)/2:y=(h/2)-{int(H*0.28)}:alpha='0.35+0.65*abs(sin(t*2.2))'")
                  base += (f",drawtext={f}textfile={files['t_main']}:fontcolor=white:fontsize={max(22, H//13)}"
                           f":x=(w-tw)/2:y=(h/2)-{int(H*0.07)}")
                  base += (f",drawtext={f}textfile={files['t_sub']}:fontcolor=0x94a3b8:fontsize={max(13, H//27)}"
                           f":x=(w-tw)/2:y=(h/2)+{int(H*0.07)}")
                  base += (f",drawtext={f}textfile={files['t_foot']}:fontcolor=0x475569:fontsize={max(10, H//44)}"
                           f":x=(w-tw)/2:y=h-{int(H*0.08)}:alpha='0.55+0.45*abs(sin(t*1.1))'")
                  vf = base + ",format=yuv420p"
              else:
                  vf = "drawbox=x=0:y=0:w=iw:h=ih:color=0x0a1020@1:t=fill,format=yuv420p"

              for i in range(POOL_N):
                  name = f"pool_{i}.ts"
                  path = os.path.join(WORK, name)
                  cmd = ["ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                         "-f", "lavfi", "-i", f"color=c=0x0a1020:s={W}x{H}:r={FPS}",
                         "-f", "lavfi", "-i", "anullsrc=channel_layout=stereo:sample_rate=44100",
                         "-t", str(SEG_DUR), "-vf", vf,
                         "-c:v", "libx264", "-profile:v", "main", "-preset", "ultrafast",
                         "-b:v", "700k", "-maxrate", "1000k", "-bufsize", "2000k",
                         "-g", str(int(FPS * SEG_DUR)), "-keyint_min", str(int(FPS * SEG_DUR)),
                         "-sc_threshold", "0", "-pix_fmt", "yuv420p",
                         "-c:a", "aac", "-b:a", "128k", "-ar", "44100", "-ac", "2",
                         "-f", "mpegts", "-copyts", path]
                  r = subprocess.run(cmd, capture_output=True, text=True)
                  if r.returncode != 0 or not os.path.exists(path):
                      log(f"pool seg {i} fail: {(r.stderr or '')[-200:]}")
                  else:
                      POOL.append(name)
              log(f"placeholder pool ready: {len(POOL)} segments")


          def add_entry(name, dur, disc):
              with LOCK:
                  STATE["seg_index"] += 1
                  ENTRIES.append({"name": name, "dur": dur, "disc": disc, "seq": STATE["seg_index"]})
                  LAST_GOOD["name"] = name
                  while len(ENTRIES) > KEEP:
                      TRASH.append((os.path.join(WORK, ENTRIES.popleft()["name"]), time.time()))


          def janitor():
              while True:
                  now = time.time()
                  with LOCK:
                      keep = []
                      for path, ts in TRASH:
                          if now - ts > TRASH_TTL:
                              try:
                                  os.remove(path)
                              except OSError:
                                  pass
                          else:
                              keep.append((path, ts))
                      TRASH[:] = keep
                  time.sleep(3)


          # ---------------------------------------------------------------- upstream
          def prime():
              """Boot: live segments (clean start) warna placeholder pool."""
              end = time.time() + 6
              seq0 = None
              while time.time() < end and UPSTREAM:
                  try:
                      st, body = fetch(UPSTREAM)
                      if st == 200 and b"#EXTM3U" in body:
                          useq, items = parse_playlist(body)
                          if items:
                              for uri, dur in items[-3:]:
                                  u = abs_url(UPSTREAM, uri)
                                  name = "lv_" + re.sub(r"[^A-Za-z0-9._-]", "_", uri.split("/")[-1])
                                  path = os.path.join(WORK, name)
                                  try:
                                      st2, data = fetch(u, timeout=12)
                                      if st2 == 200 and len(data) > 1000:
                                          with open(path + ".tmp", "wb") as f:
                                              f.write(data)
                                          os.replace(path + ".tmp", path)
                                          add_entry(name, dur, True)
                                  except Exception:
                                      pass
                              if ENTRIES:
                                  seq0 = useq
                                  log(f"primed {len(ENTRIES)} LIVE segments (clean start)")
                                  return seq0
                  except Exception:
                      pass
                  time.sleep(1)
              for _ in range(POOL_N if POOL else 0):
                  add_entry(POOL[_ % len(POOL)], SEG_DUR, True)
              log(f"primed {len(ENTRIES)} placeholder segments (source down at boot)")
              return None


          def monitor(seq0):
              last_seq = seq0
              in_fallback = seq0 is None
              last_new = time.time()
              hold_until = 0.0
              pool_i = 0
              while True:
                  got = 0
                  reachable = False
                  try:
                      if UPSTREAM:
                          st, body = fetch(UPSTREAM)
                          if st == 200 and b"#EXTM3U" in body:
                              reachable = True
                              useq, items = parse_playlist(body)
                              if items:
                                  if last_seq is None:
                                      take = items[-3:]
                                  elif useq > last_seq:
                                      take = items[-(useq - last_seq):]
                                  else:
                                      take = []
                                  if in_fallback and time.time() < hold_until:
                                      take = []
                                  for uri, dur in take[-4:]:
                                      u = abs_url(UPSTREAM, uri)
                                      name = "lv_" + re.sub(r"[^A-Za-z0-9._-]", "_", uri.split("/")[-1])
                                      path = os.path.join(WORK, name)
                                      if os.path.exists(path) and os.path.getsize(path) > 1000:
                                          add_entry(name, dur, in_fallback)
                                          got += 1
                                          continue
                                      try:
                                          st2, data = fetch(u, timeout=12)
                                          if st2 != 200 or len(data) < 1000:
                                              raise ValueError(f"http {st2}")
                                          with open(path + ".tmp", "wb") as f:
                                              f.write(data)
                                          os.replace(path + ".tmp", path)
                                          add_entry(name, dur, in_fallback)
                                          got += 1
                                      except Exception as e:
                                          reachable = False
                                          STATE["reason"] = f"seg fetch: {type(e).__name__}"
                                          break
                                  if got:
                                      last_seq = useq
                  except Exception as e:
                      STATE["up_fail"] += 1
                      STATE["reason"] = f"{type(e).__name__}: {str(e)[:70]}"

                  now = time.time()
                  if got:
                      last_new = now
                      if in_fallback:
                          log("UPSTREAM BACK -> live segments")
                          in_fallback = False
                          hold_until = 0.0
                          STATE["switched"] += 1
                  healthy = reachable and (now - last_new) < STALE

                  if healthy:
                      STATE["mode"] = "live"
                      STATE["up_ok"] += 1
                      STATE["reason"] = "live source"
                  else:
                      if not in_fallback:
                          in_fallback = True
                          hold_until = now + DWELL
                          STATE["switched"] += 1
                          log(f"UPSTREAM DOWN ({STATE['reason']}) -> placeholder (no flush, window intact)")
                      STATE["mode"] = "fallback"
                      STATE["up_fail"] += 1
                      # pool se turant segment (CPU ~0), har SEG_DUR par
                      if time.time() >= hold_until and (time.time() - last_new) >= SEG_DUR * 0.85:
                          if POOL:
                              add_entry(POOL[pool_i % len(POOL)], SEG_DUR, in_fallback)
                              pool_i += 1
                              last_new = time.time()

                  time.sleep(POLL)


          # ---------------------------------------------------------------- serving
          def playlist_text():
              with LOCK:
                  entries = list(ENTRIES)
              if not entries:
                  return ("#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:4\n"
                          "#EXT-X-MEDIA-SEQUENCE:0\n")
              lines = ["#EXTM3U", "#EXT-X-VERSION:3",
                       f"#EXT-X-TARGETDURATION:{int(max(SEG_DUR, 4))}",
                       f"#EXT-X-MEDIA-SEQUENCE:{entries[0]['seq']}",
                       "#EXT-X-INDEPENDENT-SEGMENTS"]
              for e in entries:
                  if e["disc"]:
                      lines.append("#EXT-X-DISCONTINUITY")
                  lines.append(f"#EXTINF:{e['dur']:.3f},")
                  lines.append(e["name"])
              return "\n".join(lines) + "\n"


          class Handler(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def _raw(self, code, body, ctype):
                  self.send_response(code)
                  self.send_header("Content-Type", ctype)
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Access-Control-Allow-Origin", "*")
                  self.send_header("Cache-Control", "no-cache")
                  self.end_headers()
                  self.wfile.write(body)

              def _send(self, code, body, ctype):
                  if isinstance(body, str):
                      body = body.encode()
                  try:
                      self._raw(code, body, ctype)
                  except (BrokenPipeError, ConnectionResetError):
                      self.close_connection = True

              def handle_one_request(self):
                  try:
                      super().handle_one_request()
                  except (BrokenPipeError, ConnectionResetError):
                      self.close_connection = True

              def do_GET(self):
                  p = self.path.split("?")[0]
                  if p in ("/index.m3u8", "/live.m3u8"):
                      self._send(200, playlist_text(), "application/vnd.apple.mpegurl")
                      return
                  if p == "/status.json":
                      with LOCK:
                          st = dict(STATE)
                          st["segments"] = len(ENTRIES)
                          st["pool"] = len(POOL)
                          st["log"] = list(LOG)[-30:]
                      self._send(200, json.dumps(st), "application/json")
                      return
                  if p == "/healthz":
                      self._send(200, '{"ok":true}', "application/json")
                      return

                  name = os.path.basename(p.lstrip("/"))
                  fp = os.path.join(WORK, name)
                  try:
                      if os.path.exists(fp):
                          with open(fp, "rb") as f:
                              self._raw(200, f.read(), "video/mp2t")
                          return
                      # NEVER 404: last-good ya newest available segment de do
                      State = None
                      with LOCK:
                          State = LAST_GOOD["name"]
                      for cand in (State, POOL[0] if POOL else None):
                          if cand:
                              cp = os.path.join(WORK, cand)
                              if os.path.exists(cp):
                                  with open(cp, "rb") as f:
                                      self._raw(200, f.read(), "video/mp2t")
                                  STATE["served_404"] += 1
                                  return
                      self._raw(200, b"", "video/mp2t")
                  except (BrokenPipeError, ConnectionResetError, FileNotFoundError):
                      self.close_connection = True

              def log_message(self, *a):
                  pass


          def main():
              build_pool()
              threading.Thread(target=janitor, daemon=True).start()
              seq0 = prime()
              threading.Thread(target=monitor, args=(seq0,), daemon=True).start()
              log("═" * 62)
              log(f"YTLIVE RELAY v{VER}  (no-404 · no-shrink · fresh-request retry)")
              log(f"listen :{PORT} | upstream={UPSTREAM}")
              log(f"format {W}x{H}@{FPS} | window={KEEP} segs ({int(KEEP*SEG_DUR)}s) | stale={STALE}s")
              log("source down => placeholder pool rotate, encoder kabhi nahi rukta (0s gap)")
              log("═" * 62)
              ThreadingHTTPServer(("127.0.0.1", PORT), Handler).serve_forever()


          if __name__ == "__main__":
              main()
          PYEOF
          python3 - <<'CHK'
          import ast
          src = open("/tmp/relay.py").read()
          ast.parse(src)
          ver = "3.0" if 'VER = "3.0"' in src else "OLD"
          print(f"relay.py syntax OK | RELAY VERSION = {ver}")
          assert ver == "3.0", "embedded relay purana hai — YML dobara copy karein"
          CHK

      # ───────────────────────────────────────────────────────────────────────
      # 5) STREAM — relay + ek continuous ffmpeg + watchdog + handoff
      # ───────────────────────────────────────────────────────────────────────
      - name: Stream 24/7 (seamless failover)
        env:
          YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${YT_STREAM_KEY:-}" ]; then
            echo "::error::Repo secret YT_STREAM_KEY missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "══════════════════════════════════════════════════════════════"
          echo " YTLIVE ENGINE v3.0  (relay v3: no-404 · no-shrink · fresh req)"
          echo " version verify: status.json me \"ver\":\"3.0\" aur \"pool\" dikhega"
          echo "══════════════════════════════════════════════════════════════"
          DEST="$RTMP_BASE/$YT_STREAM_KEY"
          RELAY_DIR=/tmp/relay; mkdir -p "$RELAY_DIR"
          FONT=$(fc-match -f '%{file}' "DejaVu Sans:bold" 2>/dev/null || true)
          echo "font: ${FONT:-none}"

          # ---------- relay start (kabhi band nahi hota) ----------
          start_relay () {
            UPSTREAM="$SOURCE_URL" RELAY_DIR="$RELAY_DIR" RELAY_PORT="$RELAY_PORT" \
            W="$SRC_W" H="$SRC_H" FPS="$SRC_FPS" FONT="$FONT" \
            python3 /tmp/relay.py >> /tmp/relay_out.log 2>&1 &
            RELAY_PID=$!
            for i in $(seq 1 60); do
              SEGS=$(curl -sS -m 2 "http://127.0.0.1:$RELAY_PORT/status.json" 2>/dev/null \
                     | jq -r '.segments // 0' 2>/dev/null || echo 0)
              if [ "${SEGS:-0}" -ge 3 ]; then
                echo "relay ready (pid $RELAY_PID, ${SEGS} segments)"; return 0
              fi
              sleep 1
            done
            echo "::warning::relay health check fail"; return 0
          }
          start_relay

          # ---------- status logger (har 45s log me state) ----------
          ( while : ; do
              sleep 45
              S=$(curl -sS -m 4 "http://127.0.0.1:$RELAY_PORT/status.json" 2>/dev/null || echo '{}')
              echo "[status v3] $(echo "$S" | jq -c '{ver,mode,segments,pool,switched,up_fail,served_404,reason}' 2>/dev/null || echo "$S")"
              kill -0 $RELAY_PID 2>/dev/null || { echo "[relay] mar gaya — restart"; start_relay; }
            done ) &
          WATCH=$!

          # ---------- handoff: window end se pehle next run dispatch ----------
          WF_PATH="${GITHUB_WORKFLOW_REF%@*}"; WF_FILE="${WF_PATH##*/}"
          ( sleep $(( WINDOW - HANDOFF ))
            echo "[handoff] next window dispatch ho raha hai"
            for i in 1 2 3 4 5; do
              CODE=$(curl -sS -o /tmp/disp.json -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WF_FILE}/dispatches" \
                -d "{\"ref\":\"${GITHUB_REF_NAME}\"}")
              echo "[handoff] attempt $i → HTTP $CODE"
              [ "$CODE" = "204" ] && break
              sleep $(( i * 4 ))
            done ) &
          HANDOFF_PID=$!

          # ---------- video filter (scale sirf zarurat par = CPU bachta hai) ----------
          VF="fps=$SRC_FPS,setpts=N/($SRC_FPS*TB),format=yuv420p"
          SRC_DIM=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height \
                    -of csv=p=0:nk=1 "$SOURCE_URL" 2>/dev/null | head -1 | tr -d ' ' || true)
          if [ "${SRC_DIM:-}" != "${SRC_W},${SRC_H}" ]; then
            VF="scale=$SRC_W:$SRC_H:force_original_aspect_ratio=decrease,pad=$SRC_W:$SRC_H:(ow-iw)/2:(oh-ih)/2,$VF"
            echo "source ${SRC_DIM:-?} -> output ${SRC_W}x${SRC_H} (scale ON)"
          else
            echo "source ${SRC_DIM} == output (scale OFF, CPU free)"
          fi
          PRESET="${PRESET:-superfast}"
          echo "preset=$PRESET | vf=$VF"

          # ---------- main encoder loop ----------
          START=$(date +%s)
          RUNS=0
          while : ; do
            NOW=$(date +%s); ELAPSED=$(( NOW - START ))
            REMAIN=$(( WINDOW - ELAPSED ))
            [ "$REMAIN" -le 120 ] && break         # window khatam → handoff
            RUNS=$(( RUNS + 1 ))
            echo "──── encoder #$RUNS · elapsed ${ELAPSED}s · window ${REMAIN}s · $(date -u +%H:%M:%SZ) ────"
            ENC_START=$(date +%s)

            : > /tmp/ff.err
            timeout --signal=INT $(( REMAIN + 90 )) ffmpeg -hide_banner -loglevel warning -nostdin \
              -err_detect ignore_err -fflags +genpts+igndts \
              -probesize 2000000 -analyzeduration 3000000 -live_start_index -1 \
              -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 2 \
              -rw_timeout 20000000 -http_persistent 0 -max_reload 30 \
              -i "http://127.0.0.1:$RELAY_PORT/index.m3u8" \
              -t "$REMAIN" \
              -map 0:v:0 -map 0:a:0? \
              -vf "$VF" \
              -af "aresample=async=1:first_pts=0,asetpts=N/SR/TB" \
              -fps_mode cfr \
              -c:v libx264 -preset "$PRESET" -tune zerolatency -profile:v main -level 4.1 \
              -x264-params "keyint=$(( SRC_FPS * 2 )):min-keyint=$(( SRC_FPS * 2 )):scenecut=0:rc-lookahead=0:bframes=0:ref=1:sync-lookahead=0" \
              -b:v "$BITRATE" -maxrate "$MAXRATE" -bufsize 4000k \
              -g $(( SRC_FPS * 2 )) -keyint_min $(( SRC_FPS * 2 )) -sc_threshold 0 -pix_fmt yuv420p \
              -c:a aac -b:a 128k -ar 44100 -ac 2 \
              -max_muxing_queue_size 4096 -flvflags no_duration_filesize \
              -f flv "$DEST" > /tmp/ff.out 2>/tmp/ff.err

            RC=$?
            ENC_WALL=$(( $(date +%s) - ENC_START ))
            echo "encoder cycle: ${ENC_WALL}s wall / ${REMAIN}s window"
            if [ "$RC" -eq 0 ]; then
              echo "encoder clean exit (window end)"; sleep 1
            else
              echo "encoder rc=$RC — turant restart (0.5s). wajah:"
              grep -iE "error|fail|refused|invalid|corrupt|denied|reject" /tmp/ff.err | tail -4 || tail -2 /tmp/ff.err
              sleep 0.5
            fi
          done

          echo "window complete — handoff run slot khali hone par on air ho jayega"
          kill $WATCH $HANDOFF_PID 2>/dev/null || true

      # ───────────────────────────────────────────────────────────────────────
      # 6) Backup chain (agar handoff dispatch fail hua ho)
      # ───────────────────────────────────────────────────────────────────────
      - name: Chain next run (backup)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          WF_PATH="${GITHUB_WORKFLOW_REF%@*}"; WF_FILE="${WF_PATH##*/}"
          for i in 1 2 3; do
            CODE=$(curl -sS -o /tmp/d2.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WF_FILE}/dispatches" \
              -d "{\"ref\":\"${GITHUB_REF_NAME}\"}")
            echo "backup dispatch $i → HTTP $CODE"
            [ "$CODE" = "204" ] && exit 0
            sleep $(( i * 5 ))
          done
          echo "::warning::dispatch fail — watchdog cron 20 min me khud uthayega"

      # ───────────────────────────────────────────────────────────────────────
      # 7) Keepalive (60 din inactivity par GitHub cron band kar deta hai)
      # ───────────────────────────────────────────────────────────────────────
      - name: Keepalive
        if: always()
        run: |
          set -uo pipefail
          DAY=$(date -u +%F)
          if ! grep -qx "$DAY" .keepalive 2>/dev/null; then
            echo "$DAY" >> .keepalive
            git config user.name  "ytlive-bot"
            git config user.email "ytlive-bot@users.noreply.github.com"
            git add .keepalive
            git commit -m "keepalive $DAY" || true
            git push || echo "::warning::keepalive push fail"
          fi
